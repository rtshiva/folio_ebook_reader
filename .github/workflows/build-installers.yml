name: build-installers

# Builds the Folio standalone executable, NSIS installer, and MSI installer for Windows.
# The KittenTTS neural voice model (~92MB) is installed once on demand inside the app
# and cached offline, so no large external assets are required at build time.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Installer & Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri_epub_reader/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri_epub_reader/src-tauri

      - name: Install npm dependencies
        working-directory: tauri_epub_reader
        run: npm ci

      - name: Run backend unit tests
        working-directory: tauri_epub_reader/src-tauri
        run: cargo test

      - name: Build Tauri app & installers
        working-directory: tauri_epub_reader
        run: npx tauri build

      - name: Organize release artifacts
        working-directory: tauri_epub_reader/src-tauri/target/release
        run: |
          mkdir -p dist
          # Copy standalone portable executable
          if [ -f "app.exe" ]; then
            cp "app.exe" "dist/Folio.exe"
          fi
          # Copy NSIS installer
          if compgen -G "bundle/nsis/*.exe" > /dev/null; then
            for f in bundle/nsis/*.exe; do
              cp "$f" "dist/Folio_1.0.0_x64-setup.exe"
            done
          fi
          # Copy MSI installer
          if compgen -G "bundle/msi/*.msi" > /dev/null; then
            for f in bundle/msi/*.msi; do
              cp "$f" "dist/Folio_1.0.0_x64_en-US.msi"
            done
          fi
          echo "Release artifacts:"
          ls -lh dist/

      - name: Upload installer & executable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-binaries
          retention-days: 30
          path: tauri_epub_reader/src-tauri/target/release/dist/*

  release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: folio-windows-binaries
          path: dist

      - name: List artifacts
        run: find dist -type f | sort

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
