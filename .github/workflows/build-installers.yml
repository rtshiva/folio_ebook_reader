name: build-installers

# Builds the two installer SKUs:
#   * lite — no Piper voices, ~4 MB (always buildable on GitHub runners)
#   * TTS  — full build with the bundled Piper voices (~333 MB)
#
# The Piper bundle (tauri_epub_reader/bin/piper) is gitignored, so the TTS
# job needs one of:
#   1. a self-hosted runner that already has bin/piper on disk
#      (pick it via the "TTS runner" input), or
#   2. a one-time release asset: zip the folder and upload it to a release
#      tagged `piper-bundle` in this repository, e.g.
#        cd tauri_epub_reader && tar -a -c -f piper-bundle.zip bin
#        gh release create piper-bundle piper-bundle.zip --title piper-bundle
#      The workflow downloads and unpacks it automatically.
# If neither exists the TTS job is skipped with a notice and only the lite
# installers are produced.

on:
  workflow_dispatch:
    inputs:
      build_tts:
        description: 'Also build the full TTS installer'
        type: boolean
        default: true
      tts_runner:
        description: 'Runner for the TTS job (e.g. self-hosted with bin/piper)'
        type: string
        default: 'windows-latest'
  push:
    tags: ['v*']

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  lite:
    name: Lite installers (no TTS voices)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri_epub_reader/src-tauri

      - name: Install npm dependencies
        working-directory: tauri_epub_reader
        run: npm ci

      - name: Build lite installers (no Piper resources)
        working-directory: tauri_epub_reader
        run: npx tauri build --config src-tauri/tauri.conf.lite.json

      - name: Rename artifacts
        working-directory: tauri_epub_reader/src-tauri/target/release/bundle
        run: |
          mv "nsis/Folio Reader_1.0.0_x64-setup.exe" "nsis/Folio Reader_1.0.0_x64-setup-lite.exe"
          mv "msi/Folio Reader_1.0.0_x64_en-US.msi" "msi/Folio Reader_1.0.0_x64_en-US-lite.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: folio-lite-installers
          retention-days: 30
          path: |
            tauri_epub_reader/src-tauri/target/release/bundle/nsis/*-lite.exe
            tauri_epub_reader/src-tauri/target/release/bundle/msi/*-lite.msi

  tts:
    name: Full TTS installers (Piper voices)
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.tts_runner || 'windows-latest' }}
    if: github.event_name == 'push' || inputs.build_tts
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Piper bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d tauri_epub_reader/bin/piper ]; then
            echo "Piper bundle already on this runner."
          elif gh release view piper-bundle --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download piper-bundle --repo "$GITHUB_REPOSITORY" --pattern 'piper-bundle.zip' --dir . --clobber
            rm -rf piper-extract && mkdir piper-extract
            unzip -q piper-bundle.zip -d piper-extract
            mkdir -p tauri_epub_reader/bin
            if [ -d piper-extract/piper ]; then
              mv piper-extract/piper tauri_epub_reader/bin/piper
            else
              mkdir -p tauri_epub_reader/bin/piper
              cp -r piper-extract/* tauri_epub_reader/bin/piper/
            fi
            echo "Piper bundle restored from the piper-bundle release."
          else
            echo "::notice::No bin/piper on this runner and no 'piper-bundle' release asset — skipping the TTS build. Upload the bundle once (see workflow header) or use a self-hosted runner."
            echo "TTS_SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.TTS_SKIP != 'true'
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        if: env.TTS_SKIP != 'true'

      - uses: Swatinem/rust-cache@v2
        if: env.TTS_SKIP != 'true'
        with:
          workspaces: tauri_epub_reader/src-tauri

      - name: Install npm dependencies
        if: env.TTS_SKIP != 'true'
        working-directory: tauri_epub_reader
        run: npm ci

      - name: Build full TTS installers
        if: env.TTS_SKIP != 'true'
        working-directory: tauri_epub_reader
        run: npm run build

      - name: Rename artifacts
        if: env.TTS_SKIP != 'true'
        working-directory: tauri_epub_reader/src-tauri/target/release/bundle
        run: |
          mv "nsis/Folio Reader_1.0.0_x64-setup.exe" "nsis/Folio Reader_1.0.0_x64-setup-TTS.exe"
          mv "msi/Folio Reader_1.0.0_x64_en-US.msi" "msi/Folio Reader_1.0.0_x64_en-US-TTS.msi"

      - uses: actions/upload-artifact@v4
        if: env.TTS_SKIP != 'true'
        with:
          name: folio-tts-installers
          retention-days: 30
          path: |
            tauri_epub_reader/src-tauri/target/release/bundle/nsis/*-TTS.exe
            tauri_epub_reader/src-tauri/target/release/bundle/msi/*-TTS.msi

  release:
    name: Attach installers to the release
    runs-on: ubuntu-latest
    needs: [lite, tts]
    if: always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: folio-lite-installers
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.tts.result == 'success'
        with:
          name: folio-tts-installers
          path: dist

      - name: List dist
        run: find dist -type f | sort

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
