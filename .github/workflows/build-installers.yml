name: build-installers

# Builds the Folio installer (single SKU). The KittenTTS neural voice model
# (~92MB) is NOT bundled — it downloads once on demand inside the app and
# caches offline, so no large assets are needed at build time.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri_epub_reader/src-tauri

      - name: Install npm dependencies
        working-directory: tauri_epub_reader
        run: npm ci

      - name: Build installer
        working-directory: tauri_epub_reader
        run: npx tauri build

      - name: Rename artifacts
        working-directory: tauri_epub_reader/src-tauri/target/release/bundle
        run: |
          mv "nsis/Folio Reader_1.0.0_x64-setup.exe" "nsis/Folio_1.0.0_x64-setup.exe"
          mv "msi/Folio Reader_1.0.0_x64_en-US.msi" "msi/Folio_1.0.0_x64_en-US.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: folio-installer
          retention-days: 30
          path: |
            tauri_epub_reader/src-tauri/target/release/bundle/nsis/Folio_*-setup.exe
            tauri_epub_reader/src-tauri/target/release/bundle/msi/Folio_*.msi

  release:
    name: Attach the installer to the release
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && !cancelled() && !failure() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: folio-installer
          path: dist

      - name: List dist
        run: find dist -type f | sort

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
