[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
rfd = "0.17.2"
zip = "2"
sha2 = "0.10"
ort = "2.0.0-rc.9"

# Windows-only native APIs. Kept as its own target section so a future
# macOS/Linux build compiles unchanged: keep-awake during read-aloud today
# (Win32::System::Power), monitor metrics / a11y queries as needed later.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_Power", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
