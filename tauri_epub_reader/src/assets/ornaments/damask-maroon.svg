<svg xmlns="http://www.w3.org/2000/svg" width="340" height="340" viewBox="0 0 340 340">
  <!-- Folio Reading Room · Royal Maroon damask, v3. Wallpaper rhythm: one
       elegant ogee palmette per half-tile, quarter-rosettes completing
       across the corners, lozenges marking the edge midpoints. Tone-on-tone
       burgundy fills with deep-cut detail and an embossed shadow pass; the
       gold stays reserved for frame and ornaments. -->
  <defs>
    <!-- palmette: ogee body, cut inner petal, curled crown arms -->
    <g id="pal">
      <path d="M170 22 C 199 46, 212 84, 200 116 C 193 134, 181 145, 170 150 C 159 145, 147 134, 140 116 C 128 84, 141 46, 170 22 Z" fill="#541a2c"/>
      <path d="M170 36 C 189 55, 198 86, 189 110 C 184 123, 176 132, 170 136 C 164 132, 156 123, 151 110 C 142 86, 151 55, 170 36 Z" fill="#431120"/>
      <path d="M170 50 C 180 62, 184 82, 179 98 C 176 108, 172 114, 170 118 C 168 114, 164 108, 161 98 C 156 82, 160 62, 170 50 Z" fill="#5f2033"/>
      <path d="M170 30 C 170 64, 170 96, 170 142" stroke="#2e0a15" stroke-width="2" fill="none"/>
      <!-- crown curls -->
      <path d="M148 34 C 138 26, 126 26, 120 34 C 128 36, 134 42, 136 50" stroke="#541a2c" stroke-width="3.4" fill="none"/>
      <path d="M192 34 C 202 26, 214 26, 220 34 C 212 36, 206 42, 204 50" stroke="#541a2c" stroke-width="3.4" fill="none"/>
      <!-- side leaf pads -->
      <path d="M136 108 C 124 102, 112 104, 106 114 C 116 118, 124 124, 128 134 C 132 126, 134 116, 136 108 Z" fill="#541a2c"/>
      <path d="M204 108 C 216 102, 228 104, 234 114 C 224 118, 216 124, 212 134 C 208 126, 206 116, 204 108 Z" fill="#541a2c"/>
    </g>
    <!-- corner quarter-rosette: banded arc + three petals + hub -->
    <g id="ros">
      <path d="M0 0 L 92 0" stroke="#541a2c" stroke-width="9" fill="none"/>
      <path d="M0 0 L 0 92" stroke="#541a2c" stroke-width="9" fill="none"/>
      <path d="M0 0 L 76 0" stroke="#2e0a15" stroke-width="2.2" fill="none"/>
      <path d="M0 0 L 0 76" stroke="#2e0a15" stroke-width="2.2" fill="none"/>
      <path d="M14 14 C 30 12, 44 18, 52 30 C 40 32, 26 28, 16 20 C 15 18, 14 16, 14 14 Z" fill="#541a2c"/>
      <path d="M14 14 C 12 30, 18 44, 30 52 C 32 40, 28 26, 20 16 C 18 15, 16 14, 14 14 Z" fill="#541a2c"/>
      <path d="M40 14 C 50 16, 58 22, 62 32 C 52 32, 44 28, 40 22 Z" fill="#431120"/>
      <path d="M14 40 C 16 50, 22 58, 32 62 C 32 52, 28 44, 22 40 Z" fill="#431120"/>
      <circle cx="14" cy="14" r="7" fill="#5f2033"/>
      <circle cx="14" cy="14" r="2.6" fill="#2e0a15"/>
      <circle cx="34" cy="34" r="3" fill="#541a2c"/>
    </g>
    <!-- edge-midpoint lozenge -->
    <g id="loz">
      <path d="M0 -13 L 9 0 L 0 13 L -9 0 Z" fill="#541a2c"/>
      <path d="M0 -6 L 4.5 0 L 0 6 L -4.5 0 Z" fill="#2e0a15"/>
    </g>
  </defs>

  <!-- embossed shadow pass dropped 3px -->
  <g transform="translate(2.5,3.5)" opacity=".5">
    <use href="#pal"/>
    <use href="#pal" transform="rotate(180 170 170)"/>
    <use href="#pal" transform="translate(0 170) rotate(90) scale(.6) translate(-170 -86)"/>
    <use href="#pal" transform="translate(340 170) rotate(-90) scale(.6) translate(-170 -86)"/>
    <use href="#pal" transform="translate(170 0) rotate(180) scale(.6) translate(-170 -86)"/>
    <use href="#pal" transform="translate(170 340) scale(.6) translate(-170 -86)"/>
    <use href="#ros"/>
    <use href="#ros" transform="translate(340,0) scale(-1,1)"/>
    <use href="#ros" transform="translate(0,340) scale(1,-1)"/>
    <use href="#ros" transform="translate(340,340) scale(-1,-1)"/>
    <use href="#loz" transform="translate(170,170)"/>
    <use href="#loz" transform="translate(0,170)"/>
    <use href="#loz" transform="translate(340,170)"/>
  </g>

  <!-- highlight pass -->
  <use href="#pal"/>
  <use href="#pal" transform="rotate(180 170 170)"/>
  <use href="#pal" transform="translate(0 170) rotate(90) scale(.6) translate(-170 -86)"/>
  <use href="#pal" transform="translate(340 170) rotate(-90) scale(.6) translate(-170 -86)"/>
  <use href="#pal" transform="translate(170 0) rotate(180) scale(.6) translate(-170 -86)"/>
  <use href="#pal" transform="translate(170 340) scale(.6) translate(-170 -86)"/>
  <use href="#ros"/>
  <use href="#ros" transform="translate(340,0) scale(-1,1)"/>
  <use href="#ros" transform="translate(0,340) scale(1,-1)"/>
  <use href="#ros" transform="translate(340,340) scale(-1,-1)"/>
  <use href="#loz" transform="translate(170,170)"/>
  <use href="#loz" transform="translate(0,170)"/>
  <use href="#loz" transform="translate(340,170)"/>
</svg>
