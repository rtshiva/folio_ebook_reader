<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- Folio Reading Room · gold-tooling corner filigree, v3: crisp ribbon
       scrolls (thin parallel strokes with spiral terminals), one acanthus
       cluster, beaded trail, trefoil anchor. Drawn for the top-left corner;
       the three siblings mirror via CSS transforms. Alpha geometry, used as
       a CSS mask tinted with the room gold. -->
  <g fill="none" stroke="#000" stroke-linecap="round">
    <!-- ribbon scroll along the top edge: outer stroke + inner echo -->
    <path d="M8 22 C 38 11, 76 11, 102 24 C 122 34, 133 52, 129 70 C 126 84, 111 91, 100 83 C 91 77, 92 63, 103 60 C 111 58, 117 64, 115 71" stroke-width="3.4"/>
    <path d="M14 30 C 42 21, 74 21, 96 32" stroke-width="1.5" opacity=".75"/>
    <!-- ribbon scroll down the left edge -->
    <path d="M22 8 C 11 38, 11 76, 24 102 C 34 122, 52 133, 70 129 C 84 126, 91 111, 83 100 C 77 91, 63 92, 60 103 C 58 111, 64 117, 71 115" stroke-width="3.4"/>
    <path d="M30 14 C 21 42, 21 74, 32 96" stroke-width="1.5" opacity=".75"/>
    <!-- fine diagonal guard filigree -->
    <path d="M36 36 C 54 48, 66 62, 72 80" stroke-width="1.6" opacity=".7"/>
    <path d="M44 30 C 60 40, 72 52, 80 68" stroke-width="1.2" opacity=".55"/>
    <!-- one crisp acanthus cluster on the diagonal -->
    <path d="M58 58 C 74 52, 92 56, 102 68 C 92 74, 78 74, 66 68 C 62 64, 59 61, 58 58 Z" fill="#000" stroke="none"/>
    <path d="M72 74 C 74 88, 82 100, 94 106 C 94 92, 88 80, 78 72 C 76 71, 74 72, 72 74 Z" fill="#000" stroke="none" opacity=".9"/>
    <path d="M62 66 C 64 80, 60 94, 50 104 C 46 90, 50 76, 58 66 Z" fill="#000" stroke="none" opacity=".85"/>
    <!-- leaf veins -->
    <path d="M64 62 C 76 62, 90 68, 98 78" stroke-width="1.1" opacity=".8"/>
    <path d="M74 78 C 76 90, 82 100, 90 106" stroke-width="1.1" opacity=".8"/>
    <!-- trefoil anchor at the very corner -->
    <circle cx="30" cy="30" r="6.5" fill="#000" stroke="none"/>
    <circle cx="18" cy="36" r="4" fill="#000" stroke="none"/>
    <circle cx="36" cy="18" r="4" fill="#000" stroke="none"/>
    <circle cx="30" cy="30" r="12.5" stroke-width="1.3" opacity=".75"/>
    <!-- beaded trails along the edges -->
    <circle cx="118" cy="34" r="3" fill="#000" stroke="none"/>
    <circle cx="130" cy="22" r="2" fill="#000" stroke="none"/>
    <circle cx="34" cy="118" r="3" fill="#000" stroke="none"/>
    <circle cx="22" cy="130" r="2" fill="#000" stroke="none"/>
    <!-- spiral-terminal rosettes -->
    <circle cx="115" cy="71" r="2.8" fill="#000" stroke="none"/>
    <circle cx="71" cy="115" r="2.8" fill="#000" stroke="none"/>
  </g>
</svg>
